<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Augur icons</title>
<style>
  body{background:#1a1038; color:#f3eefc; font:15px/1.5 system-ui,sans-serif; padding:24px; max-width:640px; margin:auto}
  .row{display:flex; gap:20px; flex-wrap:wrap; align-items:flex-end; margin:20px 0}
  figure{margin:0; text-align:center} canvas{background:repeating-conic-gradient(#2a2050 0 25%,#221a44 0 50%) 0 0/16px 16px; border-radius:12px; max-width:160px}
  a{color:#e8c77a}
</style>
</head>
<body>
<h1>Augur icons</h1>
<p>Exports the PNG icons from <code>icons/icon.svg</code>. Tap each link to download, then put the files in the <code>icons/</code> folder and push.
They're used when someone adds the web version to their home screen (the Android app uses its own vector icon).</p>
<div class="row" id="out"></div>
<script>
const sizes = [["icon-192.png",192],["icon-512.png",512],["apple-touch-icon.png",180]];
const img = new Image();
img.onload = () => {
  for(const [name, px] of sizes){
    const c = document.createElement("canvas"); c.width = c.height = px;
    const x = c.getContext("2d");
    // the iPhone rounds corners itself, so its icon is drawn square
    if(name.startsWith("apple")){ x.fillStyle = "#120a2a"; x.fillRect(0,0,px,px); }
    x.drawImage(img, 0, 0, px, px);
    const f = document.createElement("figure");
    const a = document.createElement("a"); a.download = name; a.href = c.toDataURL("image/png"); a.textContent = name;
    f.append(c, document.createElement("br"), a);
    document.getElementById("out").append(f);
  }
};
img.src = "icons/icon.svg";
</script>
</body>
</html>
