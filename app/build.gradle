plugins {
    id 'com.android.application'
}

android {
    namespace 'com.augur.stars'
    compileSdk 36

    defaultConfig {
        applicationId "com.augur.stars"
        minSdk 29
        targetSdk 36
        versionCode 15
        versionName "1.6.0"
    }

    // One fixed key (debug.keystore, the family key Kalendae and Fidelis use), so every new APK installs over the old one.
    def fixedKey = rootProject.file("debug.keystore")
    signingConfigs {
        debug {
            if (fixedKey.exists()) {
                storeFile fixedKey
                storePassword "fidelis123"
                keyAlias "fidelis"
                keyPassword "fidelis123"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app at the repo root is the app's interface. It's copied into the APK at build time,
    // so GitHub Pages and the APK always run the same files.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/augur-web"]
        }
    }
}

tasks.register('copyWebApp', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'i18n.js', 'i18n/*.js', 'astro.js', 'chart.js', 'native.js', 'chinese.js', 'numerology.js', 'egyptian.js', 'mayan.js',
                'texts.js', 'quotes.js', 'consensus.js', 'daily.js', 'week.js', 'ui.js', 'draw.js', 'systems.js', 'app.js', 'icons/icon-192.png'
    }
    into "$buildDir/generated/augur-web/www"
}
preBuild.dependsOn copyWebApp

dependencies {
    // serves the bundled web app from a secure https origin inside the WebView
    implementation 'androidx.webkit:webkit:1.11.0'
}
