plugins {
    id 'com.android.application'
}

android {
    namespace 'com.augur.stars'
    compileSdk 36

    defaultConfig {
        applicationId "com.augur.stars"
        minSdk 29
        targetSdk 36
        versionCode 16
        versionName "1.7.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app at the repo root is the app's interface. It's copied into the APK at build time,
    // so GitHub Pages and the APK always run the same files.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/augur-web"]
        }
    }
}

tasks.register('copyWebApp', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', 'i18n.js', 'i18n/*.js', 'astro.js', 'chart.js', 'native.js', 'chinese.js', 'numerology.js', 'egyptian.js', 'mayan.js',
                'texts.js', 'quotes.js', 'consensus.js', 'daily.js', 'week.js', 'ui.js', 'draw.js', 'systems.js', 'app.js', 'icons/icon-192.png'
    }
    into "$buildDir/generated/augur-web/www"
}
preBuild.dependsOn copyWebApp

dependencies {
    // serves the bundled web app from a secure https origin inside the WebView
    implementation 'androidx.webkit:webkit:1.11.0'
}

// The family signing key never lives in git. GitHub builds get it from the FAMILY_* secrets,
// local builds from ~/.gradle/gradle.properties.
def familyProp = { String k -> System.getenv(k) ?: project.findProperty(k) }
def familyKeystore = {
    def path = familyProp("FAMILY_KEYSTORE_PATH")
    if (path) return file(path)
    def b64 = System.getenv("FAMILY_KEYSTORE_B64")
    if (!b64) return null
    def f = new File(System.getProperty("java.io.tmpdir"), "family-${rootProject.name}.jks")
    f.bytes = Base64.mimeDecoder.decode(b64)
    return f
}()

android {
    signingConfigs {
        family {
            if (familyKeystore) {
                storeFile familyKeystore
                storePassword familyProp("FAMILY_KEYSTORE_PASSWORD")
                keyAlias familyProp("FAMILY_KEY_ALIAS")
                keyPassword familyProp("FAMILY_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.family }
        release { signingConfig signingConfigs.family }
    }
}
